# keymap-drawer config for the TOTEM keymap image (docs/images/keymap.svg).
# Renders modifiers and named keys with the macOS glyphs instead of the
# generic ZMK names. See readme.md for the command that uses this file.
parse_config:
  # Modifiers applied to another keycode, e.g. &kp LC(LG(LALT)).
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "⌥"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"

  # Plain keycodes. This key REPLACES keymap-drawer's built-in map rather than
  # merging into it, so the stock symbol entries are restated below.
  zmk_keycode_map:
    # --- keymap-drawer defaults, restated because this key replaces them ---
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LBKT: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE: '`'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    # --- macOS glyphs ---
    LGUI: "⌘"
    LEFT_GUI: "⌘"
    RGUI: "⌘"
    RIGHT_GUI: "⌘"
    LALT: "⌥"
    LEFT_ALT: "⌥"
    RALT: "⌥"
    RIGHT_ALT: "⌥"
    LCTRL: "⌃"
    LEFT_CONTROL: "⌃"
    RCTRL: "⌃"
    RIGHT_CONTROL: "⌃"
    LSHIFT: "⇧"
    LEFT_SHIFT: "⇧"
    RSHIFT: "⇧"
    RIGHT_SHIFT: "⇧"
    RET: "⏎"
    RETURN: "⏎"
    ENTER: "⏎"
    TAB: "⇥"
    ESC: "⎋"
    ESCAPE: "⎋"
    SPACE: "␣"
    BSPC: "⌫"
    BACKSPACE: "⌫"
    DEL: "⌦"
    DELETE: "⌦"
    CAPS: "⇪"
    CAPSLOCK: "⇪"
    LEFT: "←"
    DOWN: "↓"
    UP: "↑"
    RIGHT: "→"
    HOME: "↖"
    END: "↘"
    PG_UP: "⇞"
    PG_DN: "⇟"
